name: Validate Data

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
  pull_request:
    paths:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON files
        run: python3 scripts/validate.py
